# Installed as /etc/systemd/system/greetd.service.d/a733-autologin.conf
# (images built with --autologin): sway for the first regular user at boot,
# see /usr/local/sbin/a733-autologin-config.
[Service]
ExecCondition=/usr/local/sbin/a733-autologin-config
ExecStart=
ExecStart=/usr/sbin/greetd --config /run/a733-greetd.toml
